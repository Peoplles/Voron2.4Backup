sensor_pin: EBB:PA7
pullup_resistor: 10000
min_temp: 0
max_temp: 100

[temperature_sensor chamber_rear]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
min_temp: 10
